name: collect-dryrun

# 물 수집기 시험 실행: 사람이 Actions 화면에서 눌렀을 때만 돈다 (예약 실행은 물2에서 collect.yml로 더한다).
# 실제 공공 API로 한 회차를 계산하고, 결과 파일을 이 실행의 Artifacts에 올린다.
# DB에는 "write"를 켰을 때만 쓴다(계약 검사를 통과해야 함).
# 키는 GitHub Secrets에서만 읽고, 기록에는 감춘 주소만 남긴다.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "발표시각 (예: 2026-10-25 02). 비우면 지금 회차"
        required: false
        default: ""
      stations:
        description: "지점 번호 쉼표 목록 (예: 101). 비우면 전체 10곳"
        required: false
        default: ""
      wait:
        description: "마감(발표 + 90분)까지 재시도하며 기다리기"
        type: boolean
        default: false
      write:
        description: "계약 검사를 통과하면 Supabase DB에 쓰기"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 설치
        run: pip install .
      - name: 한 회차 계산 (write를 켜면 DB 쓰기)
        env:
          DATA_GO_KR: ${{ secrets.DATA_GO_KR }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLOT: ${{ inputs.slot }}
          STATIONS: ${{ inputs.stations }}
          WAIT: ${{ inputs.wait }}
          WRITE: ${{ inputs.write }}
        run: |
          args=(--out out)
          if [ -n "$SLOT" ]; then args+=(--slot "$SLOT"); fi
          if [ -n "$STATIONS" ]; then args+=(--stations "$STATIONS"); fi
          if [ "$WAIT" != "true" ]; then args+=(--no-wait); fi
          # DB에 쓸 때는 이미 정시 성공한 회차를 덮어쓰지 않는다(정기 수집 기록 보호).
          if [ "$WRITE" = "true" ]; then args+=(--write --skip-if-done); fi
          set +e
          python -m croplib_dp.collectors.water "${args[@]}" 2> err.txt
          code=$?
          cat err.txt >&2
          exit $code
      - name: 요약을 실행 화면과 알림(annotation)에 표시
        if: always()
        # 알림은 API로도 읽을 수 있어서, 실행 기록을 내려받지 못하는 곳에서도 결과를 확인할 수 있다.
        run: |
          esc() { sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'; }
          if [ -s err.txt ]; then echo "::error title=수집기 오류::$(tail -n 40 err.txt | esc)"; fi
          found=0
          for f in out/*/summary.md; do
            [ -f "$f" ] || continue
            found=1
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            # 알림 칸은 약 4KB 에서 잘리므로 짧은 요약(brief.md, 지점마다 한 줄)을 쓴다. 전체는 실행 요약 화면에.
            b="$(dirname "$f")/brief.md"
            if [ -f "$b" ]; then brief=$(cat "$b"); else brief=$(head -c 3000 "$f"); fi
            echo "::notice title=수집 요약::$(printf '%s\n' "$brief" | esc)"
          done
          if [ "$found" = 0 ]; then echo "요약 파일 없음" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: 결과 파일 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-dryrun
          path: out/
          retention-days: 7
          if-no-files-found: warn
