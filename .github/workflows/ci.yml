name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 설치
        run: pip install -e ".[dev]"
      - name: ruff (문법·스타일)
        run: ruff check .
      - name: ruff (포맷)
        run: ruff format --check .
      - name: pytest (테스트)
        run: pytest -q

  # 비밀키 검사 (이슈 #20, 결정 0013). check 와 나란히 돈다.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 저장소 이력 전체 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks 설치 (8.30.1 고정, sha256 검사)
        env:
          GH_TOKEN: ${{ github.token }} # gh release download 용(읽기 권한만, 공개 릴리스)
        run: |
          GITLEAKS_VERSION="8.30.1"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          # 받기: gh release download 를 먼저, 실패하면 curl(-f: 오류 화면을 파일로 받지 않음, 재시도 5번)로 한 번 더.
          # 이전에는 curl -sSL 만 써서 504 오류 화면(HTML)이 체크섬 파일이 되어 알 수 없는 오류로 끝났다 (#73).
          # 어느 쪽이든 받은 파일이 비어 있으면 실패로 본다. 검사를 건너뛰는 길은 없다.
          download() {
            rm -f "$1"
            if gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks --pattern "$1" && [ -s "$1" ]; then
              return 0
            fi
            echo "gh release download 실패, curl 로 다시 받습니다: $1"
            rm -f "$1"
            curl -fsSL --retry 5 --retry-all-errors -o "$1" "${BASE_URL}/$1" && [ -s "$1" ]
          }
          fail() {
            echo "::error::gitleaks 다운로드 실패: $1 (검사를 건너뛰지 않고 멈춥니다. 잠시 뒤 실행을 다시 하세요)"
            exit 1
          }

          download "${ARCHIVE}" || fail "${ARCHIVE}"
          download "${CHECKSUMS}" || fail "${CHECKSUMS}"

          # 체크섬 파일에서 이 파일 이름의 줄만 뽑는다. 없으면(오류 화면 등) 멈춘다.
          awk -v f="${ARCHIVE}" '$2 == f' "${CHECKSUMS}" > expected.sha256
          [ -s expected.sha256 ] || fail "${CHECKSUMS} 에 ${ARCHIVE} 줄이 없음"
          sha256sum --check --status expected.sha256 || { echo "::error::gitleaks sha256 불일치: ${ARCHIVE}"; exit 1; }
          rm -f expected.sha256
          tar -xzf "${ARCHIVE}" gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm -f "${ARCHIVE}" "${CHECKSUMS}"
          gitleaks version

      - name: 자체 시험 (가짜 키 탐지 확인)
        run: |
          TMP_DIR=$(mktemp -d)
          # AWS Access Key ID 모양의 가짜 값. 저장소 파일에 온전한 키가 남지 않도록 쪼개 붙인다.
          P1="AKIA"
          P2="234567QW"
          P3="ERTYUIOP"
          echo "aws_key=${P1}${P2}${P3}" > "${TMP_DIR}/fake_key.txt"

          # 종료 코드가 정확히 1 이고 출력에 규칙 이름이 있어야 "탐지"로 인정한다.
          # (사용법 오류 등으로 난 실패를 탐지로 착각하지 않기 위함)
          RC=0
          OUT=$(gitleaks dir --redact --verbose "${TMP_DIR}" 2>&1) || RC=$?
          rm -rf "${TMP_DIR}"

          if [ "${RC}" -ne 1 ]; then
            echo "::error::자체 시험 실패: 종료 코드가 1 이 아닙니다 (${RC})."
            exit 1
          fi
          if ! echo "${OUT}" | grep -q "aws-access-token"; then
            echo "::error::자체 시험 실패: 출력에 규칙 이름(aws-access-token)이 없습니다."
            exit 1
          fi
          echo "정상: 가짜 키 탐지 (종료 코드 1, 규칙 이름 확인)"

      - name: 저장소 비밀키 검사 (전체 이력)
        run: gitleaks git --redact --verbose .
