name: krei

# KREI 농업관측 수집기 (1단계): 매일 1회 20:40 KST.
# - 품목분류(reportItem)와 이번 달·다음 달 월보(montlyReport)·속보(newsReport) 목록을 조회하고,
#   새로 나온 발행물(또는 mod_date가 바뀐 건)의 PDF에서 글자 좌표(pages.json.gz)를 뽑아
#   PDF 1건마다 즉시 Storage(krei-raw)와 DB(krei.item, krei.report)에 올린다.
# - 범위 안 부류(원예 4부류 + 쌀·콩·감자)에서 판독 불가(no_text·partial) 월보를 새로 받으면
#   "[krei] 판독 불가 월보 목록(그림 PDF)" 이슈에 댓글로 자동 추가한다.
# - 실행 시작 후 시간 예산(기본 25분)이 지나면 새 PDF를 시작하지 않고 정상 종료하며,
#   남은 건은 다음 실행에서 자동으로 이어 받는다.
# - write=false(시험 실행)는 목록 조회 + PDF 표본 1건만 받고 끝낸다.
# - backfill_text_status=true 로 실행하면 PDF를 다시 받지 않고 Storage의 pages.json.gz만 읽어
#   기존 fetched 행의 text_chars·no_text_pages·text_status를 채운다.

on:
  schedule:
    - cron: "40 11 * * *" # 매일 20:40 KST
  workflow_dispatch:
    inputs:
      from:
        description: "조회 시작 연-월 (예: 2026-01, 비우면 이번 달·다음 달)"
        required: false
        default: ""
      to:
        description: "조회 끝 연-월 (예: 2026-12, 비우면 이번 달·다음 달)"
        required: false
        default: ""
      write:
        description: "계약 검사를 통과하면 Supabase DB·Storage에 쓰기 (끄면 목록 + PDF 표본 1건만 시험)"
        type: boolean
        default: false
      budget_minutes:
        description: "시간 예산(분, 기본 25 — 이 시간이 지나면 새 PDF를 시작하지 않고 정상 종료)"
        required: false
        default: "25"
      backfill_text_status:
        description: "Storage의 pages.json.gz를 읽어 기존 fetched 행의 text_chars·no_text_pages·text_status만 채우기"
        type: boolean
        default: false

concurrency:
  group: krei
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  krei:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 30 }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 설치
        run: pip install .
      - name: KREI 목록·글자 좌표 수집 (실패하면 5분 뒤 한 번 더)
        env:
          FROM_YM: ${{ inputs.from }}
          TO_YM: ${{ inputs.to }}
          # 예약 실행은 항상 쓰고, 사람이 누를 때는 write 입력을 따른다
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
          KREI_BUDGET_MINUTES: ${{ inputs.budget_minutes || '25' }}
          BACKFILL_TEXT_STATUS: ${{ inputs.backfill_text_status }}
        run: |
          args=(--out out)
          if [ -n "$FROM_YM" ]; then args+=(--from "$FROM_YM"); fi
          if [ -n "$TO_YM" ]; then args+=(--to "$TO_YM"); fi
          if [ -n "$KREI_BUDGET_MINUTES" ]; then args+=(--budget-minutes "$KREI_BUDGET_MINUTES"); fi
          if [ "$BACKFILL_TEXT_STATUS" = "true" ]; then args+=(--backfill-text-status); fi
          if [ "$WRITE" = "true" ]; then args+=(--write); fi
          set +e
          for attempt in 1 2; do
            python -m croplib_dp.collectors.krei "${args[@]}" 2> err.txt
            code=$?
            cat err.txt >&2
            if [ $code = 0 ]; then
              : > err.txt
              break
            fi
            [ $attempt = 1 ] && { echo "실패, 5분 뒤 다시"; sleep 300; }
          done
          exit $code
      - name: 요약을 실행 화면과 알림(annotation)에 표시
        if: always()
        run: |
          esc() { sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'; }
          if [ -s err.txt ]; then echo "::error title=KREI 수집기 오류::$(tail -n 40 err.txt | esc)"; fi
          for f in out/*/brief.md; do
            [ -f "$f" ] || continue
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=KREI 농업관측 수집 요약::$(cat "$f" | esc)"
          done
      - name: 결과 파일 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krei
          path: out/
          retention-days: 7
          if-no-files-found: warn
